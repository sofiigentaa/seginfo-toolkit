# Blueprint de Render para SentinelOps (seginfo-toolkit).
# Crea de una vez: la base Postgres, Redis (Key Value), los 11 microservicios
# backend y el frontend. Todo en plan Free, region Oregon.

envVarGroups:
  - name: sentinelops-shared
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PORT
        value: "8000"
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: MFA_ISSUER_NAME
        value: "SentinelOps"
      # Secretos: Render genera un valor aleatorio y lo comparte entre todos los servicios.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Link publico del frontend (para CORS).
      - key: FRONTEND_URL
        value: https://sentinelops-frontend-yk43.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sentinelops-frontend-yk43.onrender.com

databases:
  - name: sentinelops-db
    databaseName: sentinelops
    user: sentinelops
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: sentinelops-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: auth-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./backend/services/auth-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: sentinelops-shared
      - key: POSTGRES_HOST
        fromDatabase:
          name: sentinelops-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: sentinelops-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: sentinelops-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: sentinelops-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: sentinelops-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: sentinelops-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: sentinelops-redis
          property: port

  - type: web
